<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RASTRO — {% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="app-shell">
    <aside class="sidebar">
      <a href="{{ url_for('main.home') }}" class="brand" aria-label="Rastro — início">
        <img src="{{ url_for('static', filename='img/logo-rastro.png') }}" alt="Rastro">
      </a>

      <nav class="side-nav" aria-label="Navegação principal">
        <a href="{{ url_for('main.talk') }}" class="nav-item {{ 'active' if active=='talk' }}">
          <span class="nav-symbol">◌</span><span>TALK</span>
        </a>
        <a href="{{ url_for('world.index') }}" class="nav-item {{ 'active' if active=='world' }}">
          <span class="nav-symbol">◎</span><span>WORLD</span>
        </a>
        <a href="{{ url_for('main.onepct') }}" class="nav-item {{ 'active' if active=='onepct' }}">
          <span class="nav-symbol one">1%</span><span>1%</span>
        </a>
        <a href="{{ url_for('main.secret') }}" class="nav-item {{ 'active' if active=='secret' }}">
          <span class="nav-symbol">▣</span><span>SECRET</span>
        </a>
        <a href="{{ url_for('main.perfil') }}" class="nav-item {{ 'active' if active=='perfil' }}">
          <span class="nav-symbol">♙</span><span>Perfil</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-note">pequenos passos<br><strong>deixam rastros.</strong></div>
        <a href="{{ url_for('auth.logout') }}" class="sidebar-logout">Sair</a>
      </div>
    </aside>

    <div class="main-area">
      <header class="mobile-topbar">
        <a href="{{ url_for('main.home') }}" class="mobile-brand">
          <img src="{{ url_for('static', filename='img/logo-rastro.png') }}" alt="Rastro">
        </a>
        <a href="{{ url_for('auth.logout') }}" class="mobile-logout">Sair</a>
      </header>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navegação móvel">
    <a href="{{ url_for('main.talk') }}" class="{{ 'active' if active=='talk' }}"><span>◌</span>TALK</a>
    <a href="{{ url_for('world.index') }}" class="{{ 'active' if active=='world' }}"><span>◎</span>WORLD</a>
    <a href="{{ url_for('main.onepct') }}" class="{{ 'active' if active=='onepct' }}"><span class="one">1%</span>1%</a>
    <a href="{{ url_for('main.secret') }}" class="{{ 'active' if active=='secret' }}"><span>▣</span>SECRET</a>
    <a href="{{ url_for('main.perfil') }}" class="{{ 'active' if active=='perfil' }}"><span>♙</span>Perfil</a>
  </nav>

  <script src="{{ url_for('static', filename='js/estrela.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
