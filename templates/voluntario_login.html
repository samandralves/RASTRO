<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RASTRO — acesso do voluntário</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
<canvas id="starfield"></canvas>
<main class="volunteer-login-page">
  <section class="volunteer-auth-card">
    <p class="eyebrow">RASTRO · VOLUNTARIADO</p>
    <h1>Área do voluntário</h1>
    <p>Entre com sua conta de voluntário para acessar a fila de atendimentos.</p>
    {% with messages = get_flashed_messages() %}{% if messages %}<div class="side-card" style="margin-top:12px;">{{ messages[-1] }}</div>{% endif %}{% endwith %}
    <form class="volunteer-auth-form" method="post">
      <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
      <label>Senha<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="primary-btn" type="submit">Entrar</button>
    </form>
    <a class="admin-hint" href="{{ url_for('landing') }}">Voltar para o Rastro</a>
  </section>
</main>
<script src="{{ url_for('static', filename='js/estrela.js') }}"></script>
</body></html>
