{% extends "base.html" %}

{% block title %}World{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/world.css') }}">

<div class="screen world-screen">

  <div class="screen-heading">
    <p class="eyebrow">World</p>
    <h1>Seu mundo cresce com cada passo que você dá.</h1>
    <p>Cada conquista deixa uma marca permanente na sua ilha.</p>
  </div>

  <div id="world-stage-pixi" class="world-stage-pixi">
    <div id="world-loading" class="world-loading">Preparando seu mundo…</div>
  </div>

</div>
{% endblock %}

{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
  <script src="{{ url_for('static', filename='js/world-pixi.js') }}"></script>
{% endblock %}
