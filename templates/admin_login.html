<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RASTRO — acesso do administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="landing-page landing-page--narrow">
    <header class="landing-header">
      <img src="{{ url_for('static', filename='img/logo-rastro.png') }}" alt="Rastro">
    </header>

    <main class="landing-main landing-main--center">
      <section class="auth-card">
        <p class="eyebrow">ÁREA RESTRITA</p>
        <h1 class="admin-title">Acesso do administrador</h1>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
          <div class="flash-banner">
            {% for message in messages %}<p>{{ message }}</p>{% endfor %}
          </div>
          {% endif %}
        {% endwith %}

        <form class="auth-form active" method="post" action="{{ url_for('admin_login') }}">
          <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
          <label>Senha<input type="password" name="password" required autocomplete="current-password"></label>
          <button type="submit" class="primary-btn auth-submit">Entrar como administrador</button>
          <a class="admin-hint" href="{{ url_for('landing') }}">Voltar para a página inicial</a>
        </form>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/estrela.js') }}"></script>
</body>
</html>
